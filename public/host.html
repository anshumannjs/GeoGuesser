<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoGuessr — Host Display</title>
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Pannellum -->
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <!-- Leaflet -->
  <link  rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Mapillary JS SDK -->
<link  rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" />
<script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Mapillary token — injected by hostApp on init -->
  <style>
    /* ── Base ──────────────────────────────────────────────────── */
    body { overflow: hidden; user-select: none; }

    /* All screens hidden by default */
    #screen-lobby,
    #screen-countdown,
    #screen-round,
    #screen-reveal,
    #screen-leaderboard,
    #screen-gameover { display: none; height: 100vh; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       LOBBY
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #screen-lobby {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      background: var(--ink);
    }
    .lobby-code-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .lobby-code {
      font-family: var(--font-display);
      font-size: 7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent);
      line-height: 1;
    }
    .lobby-url {
      font-size: 1.1rem;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }
    .lobby-player-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 900px;
      max-height: 220px;
      overflow: hidden;
    }
    .lobby-player-chip {
      padding: 0.3rem 0.75rem;
      border-radius: 99px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      animation: chip-in 200ms ease forwards;
    }
    @keyframes chip-in {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    .lobby-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    #lobby-player-count {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--text-secondary);
    }
    #btn-start {
      min-width: 200px;
      font-size: 1.1rem;
      padding: 1rem 2.5rem;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       COUNTDOWN
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #screen-countdown {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    .host-countdown-number {
      font-family: var(--font-display);
      font-size: 18rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      animation: pop 900ms ease forwards;
    }
    .host-countdown-label {
      font-size: 1.5rem;
      color: var(--text-secondary);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       ROUND (panorama + sidebar)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #screen-round {
      flex-direction: row;
    }
    #host-pano-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #host-pannellum-viewer,
    #host-mapillary-viewer {
      width: 100%;
      height: 100%;
    }

    /* Round info bar at bottom of pano */
    #pano-info-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.5rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .pano-round-label {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
    }
    .pano-round-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    /* Sidebar */
    #host-sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--surface);
    }
    #host-timer-section {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .host-timer-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    #host-timer-digit {
      font-family: var(--font-display);
      font-size: 3.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1;
      transition: color 300ms ease;
    }
    #host-timer-digit.warn   { color: #FFB830; }
    #host-timer-digit.danger {
      color: var(--red);
      animation: pulse-danger 500ms ease-in-out infinite alternate;
    }
    #host-round-chip { font-size: 0.75rem; }

    /* Guess counter */
    #host-guess-section {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .guess-counter-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    #host-guess-count {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }
    #host-guess-total {
      font-family: var(--font-display);
      font-size: 1.25rem;
      color: var(--text-secondary);
    }
    /* Guess progress bar */
    #host-guess-bar-wrap {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    #host-guess-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 400ms ease;
    }

    /* Mini map in sidebar */
    #host-mini-map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #host-world-mini-map {
      width: 100%;
      height: 100%;
    }
    #host-campus-mini-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
    }
    #host-campus-mini-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #host-campus-mini-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Host control footer */
    #host-controls {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
    }
    #host-controls .btn { flex: 1; }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       REVEAL
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #screen-reveal {
      flex-direction: column;
    }

    /* Top bar */
    #reveal-topbar {
      flex-shrink: 0;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    #reveal-location-label {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
    }
    #reveal-round-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-family: var(--font-display);
    }
    #reveal-next-btn { min-width: 140px; }

    /* Main reveal area */
    #reveal-main {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }

    /* Map takes most of the reveal screen */
    #reveal-map-section {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #host-reveal-world-map {
      width: 100%;
      height: 100%;
    }
    #host-reveal-campus-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      display: none;
    }
    #host-reveal-campus-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #host-reveal-campus-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Podium sidebar on reveal */
    #reveal-podium-sidebar {
      width: 300px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.25rem;
      gap: 1.25rem;
      overflow-y: auto;
    }
    .podium-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .podium-entry {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      animation: podium-in 400ms ease forwards;
      opacity: 0;
    }
    .podium-entry:nth-child(1) { animation-delay: 200ms; }
    .podium-entry:nth-child(2) { animation-delay: 400ms; }
    .podium-entry:nth-child(3) { animation-delay: 600ms; }
    @keyframes podium-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .podium-medal {
      font-size: 1.75rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .podium-info { flex: 1; min-width: 0; }
    .podium-nick {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .podium-dist {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 0.1rem;
    }
    .podium-pts {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* Divider in reveal sidebar */
    .reveal-divider {
      height: 1px;
      background: var(--border);
    }

    /* Round stats */
    .reveal-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .reveal-stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .reveal-stat-value {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       LEADERBOARD
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #screen-leaderboard {
      flex-direction: column;
      padding: 2rem 3rem;
      gap: 1.5rem;
    }
    #lb-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #lb-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
    }
    #lb-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
    }
    #host-lb-list {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.375rem;
      align-content: start;
      overflow: hidden;
    }
    /* Make leaderboard rows bigger for projector readability */
    #host-lb-list .lb-row {
      padding: 0.75rem 1rem;
      grid-template-columns: 2.5rem 1fr auto auto;
    }
    #host-lb-list .lb-pos   { font-size: 1rem; }
    #host-lb-list .lb-nick  { font-size: 1rem; }
    #host-lb-list .lb-total-pts { font-size: 1.1rem; }
    #host-lb-list .lb-round-pts { font-size: 0.875rem; }

    #lb-next-btn-wrap {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       GAME OVER
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    #screen-gameover {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem;
    }
    .gameover-title {
      font-family: var(--font-display);
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.03em;
    }
    #gameover-podium-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 640px;
    }
    .gameover-podium-entry {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem;
      border-radius: var(--radius-md);
      animation: podium-in 500ms ease forwards;
      opacity: 0;
    }
    .gameover-podium-entry:nth-child(1) {
      background: #1e1a00;
      border: 1px solid #4a3d00;
      animation-delay: 300ms;
    }
    .gameover-podium-entry:nth-child(2) {
      background: #131313;
      border: 1px solid var(--border);
      animation-delay: 500ms;
    }
    .gameover-podium-entry:nth-child(3) {
      background: #17120a;
      border: 1px solid #3d2510;
      animation-delay: 700ms;
    }
    .gameover-medal { font-size: 2.5rem; }
    .gameover-nick {
      flex: 1;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
    }
    .gameover-score {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Leaflet tooltip for reveal */
    .reveal-tooltip {
      background: rgba(0,0,0,0.8) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      color: var(--text-primary) !important;
      font-family: var(--font-display) !important;
      font-size: 0.75rem !important;
      font-weight: 600 !important;
      box-shadow: none !important;
      padding: 3px 8px !important;
    }
    .reveal-tooltip::before { display: none !important; }
    .reveal-tooltip--answer {
      border-color: var(--red) !important;
      color: var(--red) !important;
    }
  </style>
</head>

<body>

<!-- ══════════════════════════════════════════════════════
     SCREEN: LOBBY
═══════════════════════════════════════════════════════ -->
<div id="screen-lobby" class="flex">

  <div style="text-align:center">
    <div class="logo-mark" style="font-size:1.5rem;margin-bottom:0.5rem">📍 GeoGuessr</div>
    <p style="color:var(--text-secondary)">Join at <span id="lobby-join-url" style="color:var(--text-primary)"></span></p>
  </div>

  <div class="lobby-code-wrap">
    <p class="t-label">Room Code</p>
    <div class="lobby-code" id="lobby-code">—</div>
  </div>

  <div id="lobby-player-grid" class="lobby-player-grid"></div>

  <div class="lobby-bottom">
    <p id="lobby-player-count" class="t-label">0 players joined</p>
    <button id="btn-start" class="btn btn-accent btn-lg">
      Start Game
    </button>
  </div>

</div>


<!-- ══════════════════════════════════════════════════════
     SCREEN: COUNTDOWN
═══════════════════════════════════════════════════════ -->
<div id="screen-countdown" class="flex">
  <p class="host-countdown-label" id="host-countdown-label">Get ready…</p>
  <div id="host-countdown-number" class="host-countdown-number">3</div>
</div>


<!-- ══════════════════════════════════════════════════════
     SCREEN: ROUND
═══════════════════════════════════════════════════════ -->
<div id="screen-round" class="flex">

  <!-- Panorama -->
  <div id="host-pano-container" style="flex:1;position:relative;background:#000;overflow:hidden;min-height:0;">
    <div id="host-pannellum-viewer" style="width:100%;height:100%;position:absolute;inset:0;"></div>
    <div id="host-mapillary-viewer" style="width:100%;height:100%;position:absolute;inset:0;"></div>

    <div id="pano-info-bar">
      <div>
        <p class="pano-round-label" id="pano-round-label">Round 1 of 10</p>
        <p class="pano-round-title" id="pano-round-title"></p>
      </div>
      <span id="host-round-chip" class="round-chip world">World</span>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="host-sidebar">

    <!-- Timer -->
    <div id="host-timer-section">
      <div class="host-timer-row">
        <span class="t-label">Time Remaining</span>
        <span id="host-timer-digit" class="t-mono">45</span>
      </div>
      <div class="timer-bar-wrap">
        <div id="host-timer-bar" class="timer-bar"></div>
      </div>
    </div>

    <!-- Guess counter -->
    <div id="host-guess-section">
      <p class="t-label">Guesses Submitted</p>
      <div class="guess-counter-wrap">
        <span id="host-guess-count">0</span>
        <span id="host-guess-total">/ —</span>
      </div>
      <div id="host-guess-bar-wrap">
        <div id="host-guess-bar"></div>
      </div>
    </div>

    <!-- Mini map -->
    <div id="host-mini-map-wrap">
      <div id="host-world-mini-map"></div>
      <div id="host-campus-mini-wrap">
        <img id="host-campus-mini-img" src="" alt="Campus map" draggable="false" />
        <canvas id="host-campus-mini-canvas"></canvas>
      </div>
    </div>

    <!-- Host controls -->
    <div id="host-controls">
      <button id="btn-end-round-early" class="btn btn-ghost" title="End round now">
        End Round Early
      </button>
    </div>

  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     SCREEN: REVEAL
═══════════════════════════════════════════════════════ -->
<div id="screen-reveal" class="flex">

  <!-- Top bar -->
  <div id="reveal-topbar">
    <div>
      <p id="reveal-round-label" class="t-label"></p>
      <h2 id="reveal-location-label" class="t-display" style="font-size:1.75rem">—</h2>
    </div>
    <button id="reveal-next-btn" class="btn btn-accent">
      Next →
    </button>
  </div>

  <!-- Main area -->
  <div id="reveal-main">

    <!-- Map -->
    <div id="reveal-map-section">
      <div id="host-reveal-world-map"></div>
      <div id="host-reveal-campus-wrap">
        <img id="host-reveal-campus-img" src="" alt="Campus map" />
        <canvas id="host-reveal-campus-canvas"></canvas>
      </div>
    </div>

    <!-- Podium sidebar -->
    <div id="reveal-podium-sidebar">
      <p class="podium-title">Top Guessers</p>
      <div id="reveal-podium-list"></div>

      <div class="reveal-divider"></div>

      <p class="podium-title">Round Stats</p>
      <div id="reveal-stats"></div>
    </div>

  </div>
</div>

  <div id="lb-header">
    <div>
      <h2 id="lb-title" class="t-display">Leaderboard</h2>
      <p id="lb-subtitle" class="t-label" style="margin-top:0.25rem"></p>
    </div>
    <button id="lb-next-btn" class="btn btn-accent">

</div>
